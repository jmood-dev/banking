  <nav class="navbar navbar-expand-sm bg-body-tertiary sticky-top" data-bs-theme="light">

        <li class="nav-item">
          <a href="home.html" class="nav-link">Accounts</a>
        </li>
        <li class="nav-item">
          <a href="transfers.html" class="nav-link active">Transfers</a>

        <li class="nav-item">
          <a href="requests.html" class="nav-link">Requests</a>
        </li>
      </ul>
    </div>
  </nav>

  <div></div>
  

  <div class="container text-center" style="margin-top: 10vh;">
    <div class="row">
      <div class="col">
        <div class="floating-box">
          <h1>Transfer</h1>

          <select id="transfer-type" class="form-select mb-2" onchange="updateTransferUI(event)">
            <option value="select" selected>Select Type</option>
            <option value="Deposit">Deposit</option>
            <option value="Internal">Internal</option>
            <option value="External">External</option>
          </select>

          <div id="transfer-ui-container">
            
          </div>

          <template id="deposit-item-template">
            <div class="transfer-ui-div">
              <div>
                <select class="deposit-account-select form-select mb-2"></select>
              </div>
              <input class="deposit-amount-input" placeholder="Amount" type="number" class="form-control">
              <button type="button" class="btn btn-primary" onclick="requestDeposit()">Deposit Money</button>
            </div>
          </template>

          <template id="internal-transfer-item-template">
            <div class="transfer-ui-div">
              <div class="form-floating">
                <select id="transfer-source-select" class="transfer-source-select form-select mb-2" onchange="transferSourceSelected()">
                  <option value=""></option>
                </select>
                <label for="transfer-source-select">From</label>
              </div>
              <div class="internal-transfer-destination-div form-floating hidden">
                <select id="transfer-destination-select" class="transfer-destination-select form-select mb-2" onchange="transferDestinationSelected()">
                  <option value=""></option>
                </select>
                <label for="transfer-destination-select">To</label>
              </div>
              <div class="internal-transfer-amount-div hidden">
                <input class="internal-transfer-amount-input" placeholder="Amount" type="number" class="form-control">
                <button type="button" class="btn btn-primary" onclick="requestInternalTransfer()">Transfer</button>
              </div>
              <div class="internal-transfer-new-connection-div hidden">
                <div class="form-floating">
                  <input id="internal-transfer-new-connection-input" placeholder="Amount" type="text" class="form-control">
                  <label for="internal-transfer-new-connection-input">Account Number</label>
                  <button type="button" class="btn btn-primary" onclick="requestNewConnection()">Request Link</button>
                </div>
              </div>
            </div>
          </template>

        </div>
      </div>
      <!-- <div class="col">
        <div class="floating-box">
          <div id="open-account-container" class="mb-2">
            <h1>New Account Details</h1>
            
            
            
            <div class="input-group mb-2">
              <input id="open-account-name-input" placeholder="Account Nickname" type="text" class="form-control">
            </div>

          </div>
          <button id="new-note-button" type="button" class="btn btn-primary" onclick="openAccount()">Open Account</button>
        </div>
      </div> -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="../js/data.js"></script>
  <script src="../assets/commonPasswords.js"></script>
  
  <script>
    initData()
    loggedInOutRedirect()
    initTransferUI()
  </script>
</body>
