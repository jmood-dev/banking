<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiggyBank Credit Union - Transfers</title>

<body>
  
  <nav class="navbar navbar-expand-sm bg-body-tertiary sticky-top pt-1 pb-1" data-bs-theme="dark">

        <div class="navbar-brand-text d-none d-md-inline-block">PiggyBank Credit Union</div>
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-0">
          <li class="nav-item">
            <a id="admin-page-link" href="admin.html" class="nav-link" style="display: none;">Configuration</a>
          </li>
        </ul>
        <ul class="navbar-nav mb-0">
          <a href="settings.html" class="nav-link">Settings</a>
          <button id="log-out-button" type="button" class="btn btn-info" onclick="logout()">Log Out</button>
        </ul>
      </div>
    </div>
  </nav>

  <nav class="navbar navbar-expand-sm bg-body-tertiary sticky-top pt-1 pb-1 subnavbar" data-bs-theme="light">
    <div class="container-fluid">
      <ul class="navbar-nav me-auto mb-0">
        <li class="nav-item">
          <a href="home.html" class="nav-link">Accounts</a>
        </li>
        <li class="nav-item">
          <a href="transfers.html" class="nav-link active">Transfers</a>
        </li>
        <li class="nav-item">
          <a href="requests.html" class="nav-link position-relative">Requests
            <span id="requests-badge" class="position-absolute top-25 start-100 translate-middle badge rounded-pill bg-danger hidden"></span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <div style="position: relative; width: 100%;" class="text-center">
    <div style="position: absolute; left: 50%;">
      <div id="alert-list" style="position: relative; left: -50%;" class="mt-2"></div>
    </div>
  </div>
  
  <template id="alert-item-template">
    <div>
      <div class="alert alert-success hidden" role="alert" style="z-index: 100;">
        <span class="message"></span>
        <button type="button" class="btn-close" aria-label="Close"></button>
      </div>
      <div class="alert alert-primary hidden" role="alert" style="z-index: 100;">
        <span class="message"></span>
        <button type="button" class="btn-close" aria-label="Close"></button>
      </div>
      <div class="alert alert-dark hidden" role="alert" style="z-index: 100;">
        <span class="message"></span>
        <button type="button" class="btn-close" aria-label="Close"></button>
      </div>
    </div>
  </template>
  

  <div class="container text-center" style="margin-top: 10vh;">
    <div class="row">
      <div class="col">
        <div class="floating-box">
          <h1>Transfer</h1>

          <select id="transfer-type" class="form-select mb-2" onchange="updateTransferUI(event)">
            <option value="select" selected>Select Type</option>
            <option value="Deposit">Deposit</option>
            <option value="Internal">Internal</option>
            <option value="External">External</option>
          </select>

          <div id="transfer-ui-container">
            
          </div>

          <template id="deposit-item-template">
            <div class="transfer-ui-div">
              <div>
                <select class="deposit-account-select form-select mb-2"></select>
              </div>
              <input class="deposit-amount-input" placeholder="Amount" type="number" min="0" step="0.01" class="form-control">
              <button type="button" class="btn btn-warning" onclick="requestDeposit()">Deposit Money</button>
            </div>
          </template>

          <template id="internal-transfer-item-template">
            <div class="transfer-ui-div">
              <div class="form-floating">
                <select id="transfer-source-select" class="transfer-source-select form-select mb-2" onchange="transferSourceSelected()">
                  <option value=""></option>
                </select>
                <label for="transfer-source-select">From</label>
              </div>
              <div class="internal-transfer-destination-div form-floating hidden">
                <select id="transfer-destination-select" class="transfer-destination-select form-select mb-2" onchange="transferDestinationSelected()">
                  <option value=""></option>
                </select>
                <label for="transfer-destination-select">To</label>
              </div>
              <div class="internal-transfer-amount-div hidden">
                <input class="internal-transfer-amount-input" placeholder="Amount" type="number" min="0" step="0.01" class="form-control">
                <button type="button" class="btn btn-warning" onclick="requestInternalTransfer()">Transfer</button>
              </div>
              <div class="internal-transfer-new-connection-div hidden">
                <div class="form-floating">
                  <input id="internal-transfer-new-connection-input" placeholder="Amount" type="text" class="form-control" oninput="checkCanRequestConnection()">
                  <label for="internal-transfer-new-connection-input">Account Number</label>
                  <button id="internal-transfer-new-connection-request-button" type="button" class="btn btn-warning mt-2" onclick="requestNewConnection()" disabled>Request Link</button>
                </div>
              </div>
            </div>
          </template>

          <template id="external-transfer-item-template">
            <div class="transfer-ui-div">
              <div class="form-floating">
                <select id="external-transfer-user-account-select" class="external-transfer-user-account-select form-select mb-2"></select>
                <label for="external-transfer-user-account-select">Your Account</label>
              </div>
              <div class="form-floating">
                <select id="external-transfer-direction-select" class="transfer-direction-select form-select mb-2" onchange="checkCanRequestExternalTranfer()">
                  <option value=""></option>
                  <option value="incoming">Receive Money</option>
                  <option value="outgoing">Send Money</option>
                </select>
                <label for="external-transfer-direction-select">I want to</label>
              </div>
              <div class="form-floating">
                <input id="external-transfer-routing-number-input" placeholder="Routing Number" type="text" class="form-control mb-2" oninput="checkCanRequestExternalTranfer()">
                <label for="external-transfer-routing-number-input">Routing Number</label>
              </div>
              <div class="form-floating">
                <input id="external-transfer-account-number-input" placeholder="Account Number" type="text" class="form-control mb-2" oninput="checkCanRequestExternalTranfer()">
                <label for="external-transfer-account-number-input">Account Number</label>
              </div>
              <div class="external-transfer-amount-div">
                <input id="external-transfer-amount-input" placeholder="Amount" type="number" min="0" step="0.01" class="mb-2 external-transfer-amount-input">
                <button id="external-transfer-request-button" type="button" class="btn btn-warning" onclick="requestExternalTransfer()" disabled>Transfer</button>
              </div>
            </div>
          </template>

        </div>
      </div>
      <!-- <div class="col">
        <div class="floating-box">
          <div id="open-account-container" class="mb-2">
            <h1>New Account Details</h1>
            
            
            
            <div class="input-group mb-2">
              <input id="open-account-name-input" placeholder="Account Nickname" type="text" class="form-control">
            </div>

          </div>
          <button id="new-note-button" type="button" class="btn btn-primary" onclick="openAccount()">Open Account</button>
        </div>
      </div> -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="../js/data.js"></script>
  <script src="../assets/commonPasswords.js"></script>
  
  <script>
    initData()
    loggedInOutRedirect()
    initTransferUI()
  </script>
</body>
</html>
