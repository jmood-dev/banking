      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-0">

        <li class="nav-item">

        </li>
      </ul>
    </div>
  </nav>

  <div></div>
  

  <div class="container" style="margin-top: 10vh;">
    <div class="row">
      <div class="col">
        <div class="floating-box">
          <h1>Requests</h1>

          <div id="request-list-container">
            <ul id="request-list" class="request-list"></ul>
          </div>

          <template id="request-list-item-template">
            <li class="request-list-item">
              <div class="d-flex justify-content-between">
                <div>
                  <div class="request-user"></div>
                  <div class="request-type"></div>
                  <div class="request-routing-number hidden"></div>
                  <div class="request-account-number hidden"></div>
                  <div class="request-amount"></div>
                </div>
                <div class="button-div">
                  <button type="button" class="btn btn-success approve-request-button">Approve</button>
                  <button type="button" class="btn btn-danger decline-request-button">Decline</button>
                </div>
              </div>
            </li>
          </template>
        </div>
      </div>

  <script src="../js/data.js"></script>
  <script src="../assets/commonPasswords.js"></script>

    initData()
    loggedInOutRedirect()
    initRequests()
  </script>
