<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiggyBank Credit Union - Manage Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" type="image/x-icon" href="../assets/piggy-bank.png">
</head>
<body>

  <nav class="navbar navbar-expand-sm bg-body-tertiary sticky-top pt-1 pb-1" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="home.html" style="padding: 0;">
        <img src="../assets/piggy-bank.png" alt="PiggyBank Credit Union" height="32">
        <div class="navbar-brand-text d-inline-block d-md-none">PBCU</div>
        <div class="navbar-brand-text d-none d-md-inline-block">PiggyBank Credit Union</div>
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-0">
          <li class="nav-item">
            <a id="admin-page-link" href="admin.html" class="nav-link" style="display: none;">Configuration</a>
          </li>
        </ul>
        <ul class="navbar-nav mb-0">
          <a href="settings.html" class="nav-link active">Settings</a>
          <button id="log-out-button" type="button" class="btn btn-info" onclick="logout()">Log Out</button>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container text-center" style="margin-top: 10vh;">
    <div class="row">
      <div class="col">
        <div class="floating-box invisible-floating-box"></div>
      </div>
      <div class="col">
        <div class="floating-box">
          <h1>Manage Settings</h1>

          <div>
            <input type="text" id="first-name-input" class="form-control mb-2" placeholder="First Name" aria-label="First Name" aria-describedby="basic-addon1">
            <input type="text" id="last-name-input" class="form-control mb-2" placeholder="Last Name" aria-label="Last Name" aria-describedby="basic-addon1">
            <input type="email" id="email-input" class="form-control mb-3" placeholder="Email" aria-label="Email" aria-describedby="basic-addon1">

            <div id="change-details-check-results">
              <p id="change-details-check-output"></p>
            </div>
            
            <button id="change-details-button" type="button" class="btn btn-warning mb-4" onclick="changeDetails()">Save Changes</button>

            <div class="input-group mb-2">
              <div id="password-checker-floating-output" class="password-checker-floating-output mb-2" style="display: none;">

                <template id="password-check-result-item-template">
                  <div></div>
                </template>

                <template id="password-strength-output-template">
                  <div class="password-strength-output">
                    <div>
                      <span>Current strength: </span>
                      <span class="strength-name-output"></span>
                    </div>
                    <div class="strength-box-output-group" style="display: flex">
                      <div class="strength-box-output"></div>
                      <div class="strength-box-output"></div>
                      <div class="strength-box-output"></div>
                      <div class="strength-box-output"></div>
                      <div class="strength-box-output"></div>
                    </div>
                  </div>
                </template>

                <div id="password-check-results"></div>
              </div>
              <input type="password" id="password-input-1" class="round-left" placeholder="Password" aria-label="Password" oninput="checkPasswordInput()">
              <span id="password-visible-span-1" class="input-group-text" style="user-select: none;" onclick="toggleVisiblePassword1()">Show</span>
            </div>

            <div class="input-group">
              <input type="password" id="password-input-2" class="round-left" placeholder="Confirm Password" aria-label="Confirm Password" oninput="checkPasswordInput()">
              <span id="password-visible-span-2" class="input-group-text" style="user-select: none;" onclick="toggleVisiblePassword2()">Show</span>
            </div>

          </div>

          <div id="passwords-dont-match-output" class="passwords-dont-match-output" style="visibility: hidden;">
            Passwords don't match</button>
          </div>
          <button id="change-password-button" type="button" class="btn btn-warning" disabled="true" onclick="changePassword()">Change Password</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="../js/data.js"></script>
  <script src="../assets/commonPasswords.js"></script>
  <script src="../js/passwordChecker.js"></script>

  <script>
    initData()
    loggedInOutRedirect()
  </script>

</body>
</html>
