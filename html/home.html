<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notewords</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" type="image/x-icon" href="../assets/notes.png">
</head>
<body>
  
  <nav class="navbar navbar-expand-sm bg-body-tertiary sticky-top" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="home.html">
        <img src="../assets/notes.png" alt="NoteWords" height="48">
        NoteWords
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a href="home.html" class="nav-link active">Notes</a>
          </li>
          <li class="nav-item">
            <a id="admin-page-link" href="admin.html" class="nav-link" style="display: none;">Configuration</a>
          </li>
        </ul>
        <ul class="navbar-nav mb-2 mb-lg-0">
          <a href="settings.html" class="nav-link">Settings</a>
          <button id="log-out-button" type="button" class="btn btn-warning" onclick="logout()">Log Out</button>
        </ul>
      </div>
    </div>
  </nav>

  <div></div>
  

  <div class="container text-center" style="margin-top: 10vh;">
    <div class="row">
      <div class="col">
        <div class="floating-box">
          <h1>Notes</h1>

          <div id="note-list-container">
            <ul id="note-list" class="note-list"></ul>
          </div>

          <template id="note-list-item-template">
            <li class="note-list-item">
              <a class="note-name link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover" href="#"></a>
            </li>
          </template>
        </div>
      </div>
      <div class="col">
        <div class="floating-box">
          <div id="note-edit-container" style="display: none;">
            <h1>Edit Note</h1>
            
            <div class="input-group mb-2">
              <input id="note-name-input" placeholder="Note name" type="text" class="form-control" onchange="updateNote()">
            </div>

            <div class="form-floating mb-2">
              <textarea class="form-control" placeholder="Enter note here" id="note-content-input" style="height: 100px" onchange="updateNote()"></textarea>
              <label for="note-content-input">Note Text</label>
            </div>

            <button id="delete-note-button" type="button" class="btn btn-danger mb-4" onclick="deleteCurrentNote()">Delete Note</button>
          </div>
          <button id="new-note-button" type="button" class="btn btn-primary" onclick="createNewNote()">New Note</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="../js/data.js"></script>
  <script src="../assets/commonPasswords.js"></script>
  
  <script>
    initData()
    loggedInOutRedirect()
    initHome()
  </script>
</body>
</html>
